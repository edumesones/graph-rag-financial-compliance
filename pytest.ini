[pytest]
testpaths = tests
python_files = test_*.py

# The database and cache fixtures in tests/conftest.py are async generators.
# Under pytest-asyncio's default strict mode they are handed to tests
# un-awaited, as raw async_generator objects, and every test that uses one
# fails with AttributeError. auto mode awaits async fixtures and tests
# without per-item decoration, and keeps working across pytest-asyncio 0.24
# and 1.x.
asyncio_mode = auto

markers =
    integration: requires the docker-compose stack (PostgreSQL, Redis, Neo4j)
    benchmark: wall-clock throughput measurement, excluded from the default run

# Benchmarks assert on elapsed time, so they report the host rather than the
# code and are order-dependent. Excluded by default; run with -m benchmark.
addopts = -m "not benchmark"
